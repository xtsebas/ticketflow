filebeat.inputs:
  - type: filestream
    id: ticketflow-api
    paths:
      - /var/log/ticketflow/api.log
    prospector.scanner.fingerprint.enabled: true
    file_identity.fingerprint: ~
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          expand_keys: true
          add_error_key: true
          message_key: message

setup.ilm.enabled: false
setup.template.enabled: false
setup.template.name: ticketflow-api
setup.template.pattern: "ticketflow-api-*"

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "ticketflow-api-%{+yyyy.MM.dd}"

logging.level: info
